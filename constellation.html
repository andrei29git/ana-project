<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the night sky · for Ana</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M92,20 C87,10 73,4 63,10 L50,20 L37,10 C27,4 13,10 8,20 C2,32 5,47 13,57 L50,90 L87,57 C95,47 98,32 92,20Z%22 fill=%22%23c0392b%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=12">
  <link rel="stylesheet" href="css/desk-test.css?v=19">
</head>
<body class="page">

  <canvas id="petal-canvas"></canvas>
  <div id="grain"></div>
  <div id="sparkle-container"></div>

  <div class="chapter-overlay open" id="overlay-constellation">
    <a class="overlay-close" href="index.html#desk">&larr; back to the desk</a>
    <section id="constellation" class="chapter constellation-section">
      <h2 class="section-heading">the sky we met under</h2>
      <p class="constellation-caption">12 July 2025 · Bucharest · past 3 a.m.</p>

      <div class="constellation-stage">
        <svg id="constellation-chart-svg" class="constellation-chart" viewBox="0 0 600 440"
             xmlns="http://www.w3.org/2000/svg" aria-label="night sky chart">
          <defs>
            <radialGradient id="sky-grad" cx="50%" cy="45%" r="60%">
              <stop offset="0%"   stop-color="#22305c"/>
              <stop offset="55%"  stop-color="#101a3e"/>
              <stop offset="100%" stop-color="#060b22"/>
            </radialGradient>
            <radialGradient id="lit-star-glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#fff2c8" stop-opacity="0.95"/>
              <stop offset="45%"  stop-color="#f6d77a" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#f6d77a" stop-opacity="0"/>
            </radialGradient>
            <filter id="star-bloom" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="2.4"/>
            </filter>
          </defs>

          <circle cx="300" cy="220" r="200" fill="url(#sky-grad)" stroke="#cda866" stroke-width="1.8"/>
          <circle cx="300" cy="220" r="194" fill="none" stroke="#cda866" stroke-width="0.5"
                  stroke-dasharray="2 3" opacity="0.45"/>

          <g class="c-corners" stroke="#ab7f37" stroke-width="0.8" fill="none">
            <path d="M 70 70 L 70 100 M 70 70 L 100 70"/>
            <path d="M 530 70 L 530 100 M 530 70 L 500 70"/>
            <path d="M 70 370 L 70 340 M 70 370 L 100 370"/>
            <path d="M 530 370 L 530 340 M 530 370 L 500 370"/>
          </g>

          <text x="300" y="12"  class="c-card" text-anchor="middle">N</text>
          <text x="300" y="436" class="c-card" text-anchor="middle">S</text>
          <text x="86"  y="226" class="c-card" text-anchor="middle">W</text>
          <text x="514" y="226" class="c-card" text-anchor="middle">E</text>

          <text x="300" y="55" class="c-chart-title" text-anchor="middle">— sphæra australis · noctis xii julii ·</text>

          <g id="constellation-stars-bg"></g>
          <g id="constellation-lines"></g>
          <g id="constellation-stars"></g>
        </svg>

        <p class="constellation-hint" id="constellation-hint">
          <span class="constellation-hint-text">one star pulses softly — start there, then trace.</span>
        </p>

        <div class="constellation-reveal" id="constellation-reveal" aria-hidden="true">
          <span class="constellation-reveal-script">Ana</span>
          <p class="constellation-reveal-desc">
            a new constellation, by David<br>
            visible only over Bucharest, only that night.
          </p>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="js/petals.js?v=3"></script>
  <script src="js/cursor.js"></script>
  <script src="js/cat.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/main.js?v=4"></script>

</body>
</html>
